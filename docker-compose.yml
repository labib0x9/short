services:
  postgres:
    image: postgres:16-alpine
    container_name: short-postgres
    environment:
      - POSTGRES_USER=${PG_SUPERUSER}
      - POSTGRES_DB=${PG_SUPERDB}
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_SUPERUSER} -d ${PG_SUPERDB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: short-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: short-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RMQ_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - backend
    restart: unless-stopped

  bootstrap:
    build: .
    container_name: short-bootstrap
    entrypoint: ["/app/bootstrap"]
    command: ["all"]
    environment:
      - ADDR=0.0.0.0
      - PORT=${PORT}
      - SERVICE_NAME=${SERVICE_NAME}
      - PREFIX=${PREFIX}
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_PORT=${PG_PORT}
      - PG_ADDRESS=postgres
      - PG_NAME=${PG_NAME}
      - PG_SSLMODE=${PG_SSLMODE}
      - PG_SUPERUSER=${PG_SUPERUSER}
      - PG_SUPERDB=${PG_SUPERDB}
      - REDIS_ADDR=redis:6379
      - RMQ_ADDR=rabbitmq:5672
      - RMQ_USER=${RMQ_USER}
      - RMQ_PASS=${RMQ_PASS}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  api:
    build: .
    container_name: short-api
    entrypoint: ["/app/short"]
    ports:
      - "3000:3000"
    environment:
      - ADDR=0.0.0.0
      - PORT=${PORT}
      - SERVICE_NAME=${SERVICE_NAME}
      - PREFIX=${PREFIX}
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_PORT=${PG_PORT}
      - PG_ADDRESS=postgres
      - PG_NAME=${PG_NAME}
      - PG_SSLMODE=${PG_SSLMODE}
      - PG_SUPERUSER=${PG_SUPERUSER}
      - PG_SUPERDB=${PG_SUPERDB}
      - REDIS_ADDR=redis:6379
      - RMQ_ADDR=rabbitmq:5672
      - RMQ_USER=${RMQ_USER}
      - RMQ_PASS=${RMQ_PASS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  rabbitmqdata: