services:
  test:
    build:
      context: .
      target: builder
    container_name: short-test
    entrypoint: ["sleep", "infinity"]
    environment:
      - ADDR=0.0.0.0
      - PORT=${PORT}
      - SERVICE_NAME=${SERVICE_NAME}
      - PREFIX=${PREFIX}
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_PORT=${PG_PORT}
      - PG_ADDRESS=postgres
      - PG_NAME=${PG_NAME}
      - PG_SSLMODE=${PG_SSLMODE}
      - PG_SUPERUSER=${PG_SUPERUSER}
      - PG_SUPERDB=${PG_SUPERDB}
      - REDIS_ADDR=redis:6379
      - RMQ_ADDR=rabbitmq:5672
      - RMQ_USER=${RMQ_USER}
      - RMQ_PASS=${RMQ_PASS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
    restart: "no"