<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>short — url shortener</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #0d0d0d;
    --surface: #141414;
    --border:  #222;
    --accent:  #00ff88;
    --accent2: #00cc6a;
    --muted:   #555;
    --dim:     #888;
    --text:    #e8e8e8;
    --red:     #ff4d4d;
    --mono:    'JetBrains Mono', 'Courier New', monospace;
  }

  html { background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 14px; }
  body { min-height: 100vh; display: flex; flex-direction: column; }

  /* ── HEADER ── */
  header {
    padding: 28px 40px 0;
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .logo {
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.5px;
  }
  .logo span { color: var(--muted); font-weight: 300; }
  .tagline { color: var(--muted); font-size: 12px; }

  /* ── MAIN ── */
  main {
    flex: 1;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
    padding: 60px 24px 80px;
  }

  /* ── TABS ── */
  .tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 40px;
  }
  .tab {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    cursor: pointer;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    padding: 10px 20px 10px 0;
    margin-bottom: -1px;
    text-transform: uppercase;
    transition: color 0.15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    border-bottom-color: var(--accent);
    color: var(--accent);
  }

  /* ── PANELS ── */
  .panel { display: none; }
  .panel.active { display: block; }

  /* ── SHORTEN PANEL ── */
  .input-row {
    display: flex;
    gap: 10px;
    align-items: stretch;
  }
  .url-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 13px 16px;
    outline: none;
    transition: border-color 0.15s;
  }
  .url-input::placeholder { color: var(--muted); }
  .url-input:focus { border-color: var(--accent); }

  .btn {
    background: var(--accent);
    border: none;
    border-radius: 4px;
    color: #000;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 13px 22px;
    text-transform: uppercase;
    transition: background 0.15s, transform 0.1s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--accent2); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { background: var(--muted); cursor: not-allowed; transform: none; }

  .btn-ghost {
    background: none;
    border: 1px solid var(--border);
    color: var(--dim);
    transition: border-color 0.15s, color 0.15s;
  }
  .btn-ghost:hover { background: none; border-color: var(--accent); color: var(--accent); }

  /* expiry row */
  .options-row {
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .options-row label { color: var(--muted); font-size: 12px; }

  /* date + time inputs (split, instead of datetime-local) */
  .date-input,
  .time-input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--dim);
    font-family: var(--mono);
    font-size: 12px;
    padding: 7px 10px;
    outline: none;
    transition: border-color 0.15s;
  }
  .date-input { min-width: 140px; }
  .time-input { min-width: 110px; }
  .date-input:focus,
  .time-input:focus { border-color: var(--accent); color: var(--text); }
  .date-input::-webkit-calendar-picker-indicator,
  .time-input::-webkit-calendar-picker-indicator { filter: invert(0.4); cursor: pointer; }

  /* result box */
  .result-box {
    margin-top: 28px;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    display: none;
  }
  .result-box.visible { display: block; }
  .result-header {
    background: var(--surface);
    padding: 10px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
  }
  .result-header .label { color: var(--muted); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }
  .result-header .status-ok { color: var(--accent); font-size: 11px; }
  .result-body { padding: 20px; }
  .short-url-display {
    font-size: 20px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: -0.3px;
    word-break: break-all;
  }
  .result-meta {
    margin-top: 10px;
    color: var(--muted);
    font-size: 11px;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }
  .result-meta span { display: flex; gap: 6px; }
  .result-meta .key { color: var(--muted); }
  .result-meta .val { color: var(--dim); }
  .result-actions {
    margin-top: 16px;
    display: flex;
    gap: 10px;
  }
  .copy-feedback { color: var(--accent); font-size: 12px; opacity: 0; transition: opacity 0.2s; }
  .copy-feedback.show { opacity: 1; }

  /* error */
  .error-box {
    margin-top: 20px;
    background: #1a0a0a;
    border: 1px solid #3a1111;
    border-radius: 4px;
    color: var(--red);
    font-size: 12px;
    padding: 12px 16px;
    display: none;
  }
  .error-box.visible { display: block; }
  .error-box::before { content: 'error: '; color: #ff7070; }

  /* ── ANALYTICS PANEL ── */
  .stat-input-row { display: flex; gap: 10px; }
  .code-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 13px 16px;
    outline: none;
    transition: border-color 0.15s;
  }
  .code-input::placeholder { color: var(--muted); }
  .code-input:focus { border-color: var(--accent); }

  .stat-grid {
    margin-top: 28px;
    display: none;
  }
  .stat-grid.visible { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 18px;
  }
  .stat-card.full { grid-column: 1 / -1; }
  .stat-card-title {
    color: var(--muted);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .big-number {
    font-size: 42px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }
  .big-number-label { color: var(--muted); font-size: 11px; margin-top: 4px; }

  /* bar chart */
  .bar-list { display: flex; flex-direction: column; gap: 9px; }
  .bar-item { display: flex; flex-direction: column; gap: 4px; }
  .bar-label-row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
  }
  .bar-label-row .name { color: var(--dim); }
  .bar-label-row .count { color: var(--muted); }
  .bar-track {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    width: 0;
    transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* meta row in analytics */
  .stat-meta {
    grid-column: 1 / -1;
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    color: var(--muted);
    font-size: 11px;
    padding: 14px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
  }
  .stat-meta .entry { display: flex; gap: 8px; }
  .stat-meta .k { color: var(--muted); }
  .stat-meta .v { color: var(--dim); }

  /* ── SPINNER ── */
  .spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── COMPRESS ANIMATION ── */
  @keyframes compress {
    0%   { letter-spacing: 0.15em; opacity: 0.4; }
    60%  { letter-spacing: -0.05em; opacity: 1; }
    100% { letter-spacing: -0.03em; opacity: 1; }
  }
  .short-url-display.animating {
    animation: compress 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  /* ── FOOTER ── */
  footer {
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    padding: 16px 40px;
    display: flex;
    gap: 24px;
  }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--accent); }

  /* ── RESPONSIVE ── */
  @media (max-width: 560px) {
    header { padding: 20px 20px 0; }
    main { padding: 40px 16px 60px; }
    .input-row { flex-direction: column; }
    .stat-grid.visible { grid-template-columns: 1fr; }
    .stat-card.full { grid-column: 1; }
    footer { padding: 16px 20px; flex-wrap: wrap; gap: 12px; }
    .big-number { font-size: 32px; }
    .date-input, .time-input { flex: 1; min-width: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .short-url-display.animating { animation: none; }
    .bar-fill { transition: none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">short<span>/short</span></div>
  <div class="tagline">// url compression service</div>
</header>

<main>
  <div class="tabs">
    <button class="tab active" data-tab="shorten">shorten</button>
    <button class="tab" data-tab="analytics">analytics</button>
  </div>

  <!-- ── SHORTEN PANEL ── -->
  <div class="panel active" id="panel-shorten">
    <div class="input-row">
      <input
        class="url-input"
        id="url-input"
        type="url"
        placeholder="https://your-very-long-url.com/goes/here"
        autocomplete="off"
        spellcheck="false"
      />
      <button class="btn" id="shorten-btn">shorten →</button>
    </div>
    <div class="options-row">
      <label for="expire-date-input">expire at</label>
      <input class="date-input" id="expire-date-input" type="date" />
      <input class="time-input" id="expire-time-input" type="time" />
      <button class="btn btn-ghost" id="clear-expire" style="padding:7px 12px;font-size:11px;">clear</button>
    </div>

    <div class="result-box" id="result-box">
      <div class="result-header">
        <span class="label">shortened url</span>
        <span class="status-ok">▲ 201 created</span>
      </div>
      <div class="result-body">
        <div class="short-url-display" id="short-url-display"></div>
        <div class="result-meta" id="result-meta"></div>
        <div class="result-actions">
          <button class="btn" id="copy-btn" style="font-size:11px;padding:9px 16px;">copy url</button>
          <button class="btn btn-ghost" id="view-stat-btn" style="font-size:11px;padding:9px 16px;">view stats</button>
          <span class="copy-feedback" id="copy-feedback">copied!</span>
        </div>
      </div>
    </div>

    <div class="error-box" id="shorten-error"></div>
  </div>

  <!-- ── ANALYTICS PANEL ── -->
  <div class="panel" id="panel-analytics">
    <div class="stat-input-row">
      <input
        class="code-input"
        id="code-input"
        type="text"
        placeholder="enter short code  (e.g. aB3kZ9)"
        autocomplete="off"
        spellcheck="false"
        maxlength="20"
      />
      <button class="btn" id="stat-btn">fetch →</button>
    </div>

    <div class="error-box" id="stat-error"></div>

    <div class="stat-grid" id="stat-grid">
      <div class="stat-card">
        <div class="stat-card-title">total clicks</div>
        <div class="big-number" id="stat-total">0</div>
        <div class="big-number-label">all time</div>
      </div>
      <div class="stat-meta" id="stat-meta"></div>
      <div class="stat-card">
        <div class="stat-card-title">browsers</div>
        <div class="bar-list" id="bar-browser"></div>
      </div>
      <div class="stat-card">
        <div class="stat-card-title">operating systems</div>
        <div class="bar-list" id="bar-os"></div>
      </div>
      <div class="stat-card full">
        <div class="stat-card-title">devices</div>
        <div class="bar-list" id="bar-device"></div>
      </div>
    </div>
  </div>
</main>

<footer>
  <span>short/short</span>
  <a href="/short" style="pointer-events:none;cursor:default;">POST /short</a>
  <a href="#" id="footer-stat-link">GET /{code}/stat</a>
</footer>

<script>
  // ── CONFIG ──────────────────────────────────────────────
  // When served from Go, requests go to the same origin.
  // Change BASE if running frontend separately during dev.
  const BASE = '';

  // ── TABS ────────────────────────────────────────────────
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
    });
  });

  function switchTab(name) {
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', t.dataset.tab === name);
    });
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + name).classList.add('active');
  }

  // ── HELPERS ─────────────────────────────────────────────
  function setLoading(btn, loading) {
    if (loading) {
      btn._orig = btn.innerHTML;
      btn.innerHTML = '<span class="spinner"></span>wait';
      btn.disabled = true;
    } else {
      btn.innerHTML = btn._orig;
      btn.disabled = false;
    }
  }

  function showError(el, msg) {
    el.textContent = msg;
    el.classList.add('visible');
  }

  function hideError(el) {
    el.classList.remove('visible');
  }

  function fmtDate(iso) {
    if (!iso) return 'never';
    return new Date(iso).toLocaleString(undefined, {
      year: 'numeric', month: 'short', day: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  }

  function buildBars(containerId, data) {
    const el = document.getElementById(containerId);
    el.innerHTML = '';
    if (!data || Object.keys(data).length === 0) {
      el.innerHTML = '<div style="color:var(--muted);font-size:12px;">no data yet</div>';
      return;
    }
    const entries = Object.entries(data).sort((a, b) => b[1] - a[1]);
    const max = entries[0][1];
    entries.forEach(([name, count]) => {
      const pct = max > 0 ? (count / max) * 100 : 0;
      const item = document.createElement('div');
      item.className = 'bar-item';
      item.innerHTML = `
        <div class="bar-label-row">
          <span class="name">${name || 'unknown'}</span>
          <span class="count">${count}</span>
        </div>
        <div class="bar-track"><div class="bar-fill" data-pct="${pct}"></div></div>
      `;
      el.appendChild(item);
    });
    // trigger animation after paint
    requestAnimationFrame(() => {
      el.querySelectorAll('.bar-fill').forEach(bar => {
        bar.style.width = bar.dataset.pct + '%';
      });
    });
  }

  // ── SHORTEN ─────────────────────────────────────────────
  let lastCode = '';

  document.getElementById('clear-expire').addEventListener('click', () => {
    document.getElementById('expire-date-input').value = '';
    document.getElementById('expire-time-input').value = '';
  });

  document.getElementById('url-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('shorten-btn').click();
  });

  document.getElementById('shorten-btn').addEventListener('click', async () => {
    const urlVal    = document.getElementById('url-input').value.trim();
    const dateVal   = document.getElementById('expire-date-input').value; // YYYY-MM-DD
    const timeVal   = document.getElementById('expire-time-input').value; // HH:MM
    const btn       = document.getElementById('shorten-btn');
    const errEl     = document.getElementById('shorten-error');
    const resultBox = document.getElementById('result-box');

    hideError(errEl);
    resultBox.classList.remove('visible');

    if (!urlVal) {
      showError(errEl, 'url is required');
      return;
    }

    const body = { url: urlVal };

    // Combine date + time into a single ISO timestamp.
    // If only the date is set, default the time to 00:00.
    if (dateVal) {
      const combined = `${dateVal}T${timeVal || '00:00'}`;
      const parsed = new Date(combined);
      if (isNaN(parsed.getTime())) {
        showError(errEl, 'invalid expiry date/time');
        return;
      }
      body.expire_at = parsed.toISOString();
    }

    setLoading(btn, true);
    try {
      const res = await fetch(`${BASE}/short`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });

      const data = await res.json();

      if (!res.ok) {
        showError(errEl, `server returned ${res.status}`);
        return;
      }

      lastCode = data.code;

      const display = document.getElementById('short-url-display');
      display.textContent = data.short_url;
      display.classList.remove('animating');
      void display.offsetWidth; // reflow to restart animation
      display.classList.add('animating');

      const meta = document.getElementById('result-meta');
      meta.innerHTML = `
        <span><span class="key">code</span><span class="val">${data.code}</span></span>
        <span><span class="key">expires</span><span class="val">${fmtDate(data.expire_at)}</span></span>
      `;

      resultBox.classList.add('visible');
    } catch (err) {
      showError(errEl, 'could not reach server — is the Go service running?');
    } finally {
      setLoading(btn, false);
    }
  });

  document.getElementById('copy-btn').addEventListener('click', () => {
    const url = document.getElementById('short-url-display').textContent;
    navigator.clipboard.writeText(url).then(() => {
      const fb = document.getElementById('copy-feedback');
      fb.classList.add('show');
      setTimeout(() => fb.classList.remove('show'), 1800);
    });
  });

  document.getElementById('view-stat-btn').addEventListener('click', () => {
    document.getElementById('code-input').value = lastCode;
    switchTab('analytics');
    document.getElementById('stat-btn').click();
  });

  // ── ANALYTICS ───────────────────────────────────────────
  document.getElementById('code-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('stat-btn').click();
  });

  document.getElementById('stat-btn').addEventListener('click', async () => {
    const code  = document.getElementById('code-input').value.trim();
    const btn   = document.getElementById('stat-btn');
    const errEl = document.getElementById('stat-error');
    const grid  = document.getElementById('stat-grid');

    hideError(errEl);
    grid.classList.remove('visible');

    if (!code) {
      showError(errEl, 'short code is required');
      return;
    }

    setLoading(btn, true);
    try {
      const res = await fetch(`${BASE}/${code}/stat`);

      if (res.status === 404) {
        showError(errEl, `code "${code}" not found`);
        return;
      }
      if (!res.ok) {
        showError(errEl, `server returned ${res.status}`);
        return;
      }

      const data = await res.json();

      document.getElementById('stat-total').textContent = data.total_count ?? 0;

      const meta = document.getElementById('stat-meta');
      meta.innerHTML = `
        <div class="entry"><span class="k">short</span><span class="v">${data.short}</span></div>
        <div class="entry"><span class="k">expires</span><span class="v">${fmtDate(data.expire_at)}</span></div>
      `;

      buildBars('bar-browser', data.browser);
      buildBars('bar-os',      data.os);
      buildBars('bar-device',  data.device);

      grid.classList.add('visible');
    } catch (err) {
      showError(errEl, 'could not reach server — is the Go service running?');
    } finally {
      setLoading(btn, false);
    }
  });
</script>
</body>
</html>
